@switch (timer.state) {
    @case ('idle') {
        <button class="primary-btn" (click)="startTimer()">
            <lucide-icon [img]="PlayIcon" [size]="20"></lucide-icon>Start Focus
        </button>
    }
    @case ('running') {
        <div class="control-group">
            <button class="primary-btn" (click)="pauseTimer()">
                <lucide-icon [img]="PauseIcon" [size]="20"></lucide-icon>Pause
            </button>
            <button class="danger-btn" (click)="stopTimer()">
                <lucide-icon [img]="ResetIcon" [size]="20"></lucide-icon>Reset
            </button>
        </div>
    }
    @case ('paused') {
        <div class="control-group">
            <button class="primary-btn" (click)="resumeTimer()">
        <lucide-icon [img]="PlayIcon" [size]="20"></lucide-icon>Resume
        </button>
        <button class="danger-btn" (click)="stopTimer()">
            <lucide-icon [img]="ResetIcon" [size]="20"></lucide-icon>Reset
        </button>
    </div>
    }
    @case ('finished') {
        <button class="primary-btn" (click)="startTimer()">
            <lucide-icon [img]="PlayIcon" [size]="20"></lucide-icon>Start Focus
        </button>
    }
}
