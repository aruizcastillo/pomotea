<div class="theme-group" role="radiogroup" aria-label="Seleccionar tema">
  <button class="secondary-btn theme-option" [class.selected]="selectedTheme === 'tea'" (click)="setTheme('tea')">
    <span class="btn-content">🍵 <span class="label-text">Tea</span></span>
  </button>

  <button class="secondary-btn theme-option" [class.selected]="selectedTheme === 'coffee'" (click)="setTheme('coffee')">
    <span class="btn-content">☕ <span class="label-text">Coffee</span></span>
  </button>
</div>
